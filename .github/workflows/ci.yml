name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run ToppleCat release gate
        run: scripts/verify-release.sh
        env:
          GRADLE_CMD: ./gradlew
