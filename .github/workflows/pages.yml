name: Deploy project page and documentation

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - README.zh-TW.md
      - CONTEXT.md
      - docs/**
      - site/**
      - samples/junit-cart-orders/**
      - scripts/verify-docs.py
      - scripts/verify-samples.sh
      - scripts/verify-site-artifact.py
      - .github/workflows/pages.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  change-scope:
    name: Determine change scope
    runs-on: ubuntu-latest
    outputs:
      website_only: ${{ steps.scope.outputs.website_only }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect website-only changes
        id: scope
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          website_only=true
          while IFS= read -r path; do
            if [[ -n "$path" && "$path" != site/* ]]; then
              website_only=false
              break
            fi
          done <<< "$changed_files"

          echo "website_only=$website_only" >> "$GITHUB_OUTPUT"

  project-verification:
    name: Verify Java project and executable sample
    needs: change-scope
    if: needs.change-scope.outputs.website_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run project checks
        run: ./gradlew check

      - name: Run release gate
        run: scripts/verify-release.sh
        env:
          GRADLE_CMD: ./gradlew

      - name: Exercise the JUnit sample against the local release candidate
        run: bash samples/junit-cart-orders/demo.sh all
        env:
          TOPPLECAT_USE_MAVEN_LOCAL: "true"

  build:
    name: Build and verify Pages artifact
    needs:
      - change-scope
      - project-verification
    if: ${{ always() && needs.change-scope.result == 'success' && (needs.project-verification.result == 'success' || needs.project-verification.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: site/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --requirement site/requirements.txt

      - name: Install page dependencies
        working-directory: site
        run: npm ci

      - name: Build project page and bilingual docs
        working-directory: site
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Verify public Markdown and documentation boundaries
        run: python3 scripts/verify-docs.py

      - name: Verify the served final Pages artifact
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python3 scripts/verify-site-artifact.py --self-test --base-path "$PAGES_BASE_PATH"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Deploy verified Pages artifact
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
