name: Feature request
description: Propose a focused improvement to ToppleCat's Java/JUnit verification workflow.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Developer problem
      description: Describe the workflow problem before proposing an API.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain what a first-time user should be able to do.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Product boundary
      options:
        - label: This keeps Java/JUnit and typed JSON/YAML as the executable contract.
          required: true
        - label: This does not expose reviewer-only data to an implementation agent.
          required: true
