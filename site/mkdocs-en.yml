site_name: ToppleCat documentation
site_description: "Meet ToppleCat from the beginning: how it rechecks AI-delivered Java, what it tests, and which decisions still belong to people."
site_url: !ENV [DOCS_SITE_URL, https://topplecat.samzhu.dev/docs]
docs_dir: docs/en
site_dir: dist/docs
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: docs-theme
  language: en
  font: false
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: topplecat
      primary: custom
      accent: amber
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
plugins: []
extra:
  site_origin: !ENV [PUBLIC_ORIGIN, https://topplecat.samzhu.dev]
  base_path: !ENV [PAGES_BASE_PATH, ""]
  homepage: !ENV [PROJECT_HOMEPAGE, /]
extra_css:
  - assets/stylesheets/topplecat-docs.css
extra_javascript:
  - assets/javascripts/topplecat-docs.js
nav:
  - Meet ToppleCat:
      - What is ToppleCat?: index.md
      - When it is useful: product-definition.md
      - How it verifies a delivery: verification-and-evidence.md
      - From rules to results: architecture.md
      - Glossary: glossary.md
  - Start using it:
      - Install ToppleCat: getting-started.md
      - Turn rules into checks: authoring-contracts.md
  - Get unstuck:
      - Troubleshooting: troubleshooting.md
  - Reference:
      - What's in ToppleCat 0.2.2: release-notes.md
