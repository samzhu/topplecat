site_name: ToppleCat documentation
site_description: Task-oriented technical documentation for ToppleCat's executable acceptance contract and verification gate.
site_url: !ENV [DOCS_SITE_URL, https://topplecat.samzhu.dev/docs]
docs_dir: docs/en
site_dir: dist/docs
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: docs-theme
  language: en
  font: false
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: topplecat
      primary: custom
      accent: amber
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
plugins: []
extra:
  site_origin: !ENV [PUBLIC_ORIGIN, https://topplecat.samzhu.dev]
  base_path: !ENV [PAGES_BASE_PATH, ""]
extra_css:
  - assets/stylesheets/topplecat-docs.css
extra_javascript:
  - assets/javascripts/topplecat-docs.js
nav:
  - Start:
      - Documentation home: index.md
      - Getting started: getting-started.md
  - Author contracts:
      - Authoring contracts: authoring-contracts.md
  - Verify deliveries:
      - Verification and evidence: verification-and-evidence.md
  - Understand ToppleCat:
      - Product definition: product-definition.md
      - Architecture: architecture.md
      - Glossary: glossary.md
  - Help:
      - Troubleshooting: troubleshooting.md
  - Reference:
      - Current release notes: release-notes.md
