site_name: ToppleCat documentation
site_description: Learn how ToppleCat checks an AI coding agent's done claim and gives a human fresh evidence before accepting a Java delivery.
site_url: !ENV [DOCS_SITE_URL, https://topplecat.samzhu.dev/docs]
docs_dir: docs/en
site_dir: dist/docs
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: docs-theme
  language: en
  font: false
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: topplecat
      primary: custom
      accent: amber
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
plugins: []
extra:
  site_origin: !ENV [PUBLIC_ORIGIN, https://topplecat.samzhu.dev]
  base_path: !ENV [PAGES_BASE_PATH, ""]
extra_css:
  - assets/stylesheets/topplecat-docs.css
extra_javascript:
  - assets/javascripts/topplecat-docs.js
nav:
  - Learn by doing:
      - Why ToppleCat: index.md
      - See it catch a bad delivery: getting-started.md
  - Use ToppleCat:
      - Turn rules into checks: authoring-contracts.md
      - Verify a delivery: verification-and-evidence.md
  - Understand:
      - What ToppleCat does: product-definition.md
      - How ToppleCat works: architecture.md
      - Glossary: glossary.md
  - Get unstuck:
      - Troubleshooting: troubleshooting.md
  - Reference:
      - What's in 0.1.0: release-notes.md
