site_name: ToppleCat 文件
site_description: 了解 ToppleCat 如何檢查 AI coding agent 的完成宣稱，並在接受 Java 交付前留下可讀的當次證據。
site_url: !ENV [DOCS_SITE_URL, https://topplecat.samzhu.dev/docs/zh-TW]
docs_dir: docs/zh-TW
site_dir: dist/docs/zh-TW
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: docs-theme
  language: zh-Hant
  font: false
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: topplecat
      primary: custom
      accent: amber
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: 連結到這個段落
plugins: []
extra:
  site_origin: !ENV [PUBLIC_ORIGIN, https://topplecat.samzhu.dev]
  base_path: !ENV [PAGES_BASE_PATH, ""]
extra_css:
  - assets/stylesheets/topplecat-docs.css
extra_javascript:
  - assets/javascripts/topplecat-docs.js
nav:
  - 從範例開始:
      - 為什麼需要 ToppleCat: index.md
      - 看它攔下錯誤交付: getting-started.md
  - 用在專案裡:
      - 把規則寫成檢查: authoring-contracts.md
      - 驗證交付: verification-and-evidence.md
  - 進一步了解:
      - ToppleCat 解決什麼問題: product-definition.md
      - 系統如何運作: architecture.md
      - 名詞解釋: glossary.md
  - 遇到問題:
      - 排除問題: troubleshooting.md
  - 版本參考:
      - 0.1.0 版本說明: release-notes.md
