site_name: ToppleCat 文件
site_description: "從零認識 ToppleCat：它如何重新驗證 AI 寫好的 Java 功能、會檢查什麼，以及人最後要做什麼決定。"
site_url: !ENV [DOCS_SITE_URL, https://topplecat.samzhu.dev/docs/zh-TW]
docs_dir: docs/zh-TW
site_dir: dist/docs/zh-TW
use_directory_urls: true
strict: true
theme:
  name: material
  custom_dir: docs-theme
  language: zh-Hant
  font: false
  favicon: assets/favicon.svg
  logo: assets/favicon.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.follow
    - content.code.copy
  palette:
    - scheme: topplecat
      primary: custom
      accent: amber
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      permalink_title: 連結到這個段落
plugins: []
extra:
  site_origin: !ENV [PUBLIC_ORIGIN, https://topplecat.samzhu.dev]
  base_path: !ENV [PAGES_BASE_PATH, ""]
extra_css:
  - assets/stylesheets/topplecat-docs.css
extra_javascript:
  - assets/javascripts/topplecat-docs.js
nav:
  - 認識 ToppleCat:
      - ToppleCat 是什麼: index.md
      - 適合什麼情境: product-definition.md
      - 如何檢查交付: verification-and-evidence.md
      - 從規則到結果: architecture.md
      - 名詞解釋: glossary.md
  - 開始使用:
      - 先跑一個範例: getting-started.md
      - 把規則寫成檢查: authoring-contracts.md
  - 遇到問題:
      - 排除問題: troubleshooting.md
  - 版本參考:
      - 0.1.0 版本說明: release-notes.md
